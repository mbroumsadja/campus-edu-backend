# CE-07 — Sauvegarde quotidienne de la base Supabase + test de restauration hebdomadaire.
# Secrets requis (Settings > Secrets and variables > Actions) :
#   SUPABASE_DB_URL     URI Postgres directe (port 5432) ou session pooler — pas le transaction pooler (6543)
#   BACKUP_PASSPHRASE   phrase secrète longue : la sauvegarde est chiffrée avant d'être stockée
name: Sauvegarde base de données

on:
  schedule:
    - cron: '17 2 * * *'     # 02h17 UTC, chaque jour (RPO 24 h)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      restore_db:
        image: postgres:16
        env: { POSTGRES_PASSWORD: restore, POSTGRES_DB: campus_restore }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Client PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Sauvegarde
        env: { BACKUP_DB_URL: '${{ secrets.SUPABASE_DB_URL }}' }
        run: ./scripts/backup-db.sh backups

      - name: Test de restauration (le dimanche et à la demande)
        env:
          RESTORE_TEST_URL: postgres://postgres:restore@localhost:5432/campus_restore
          SOURCE_DB_URL: '${{ secrets.SUPABASE_DB_URL }}'
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ./scripts/restore-test.sh "$(ls backups/*.dump | head -1)"
          else
            echo "Test de restauration réservé au dimanche"
          fi

      - name: Chiffrement
        env: { BACKUP_PASSPHRASE: '${{ secrets.BACKUP_PASSPHRASE }}' }
        run: |
          for f in backups/*.dump; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 --output "$f.gpg" "$f"
            rm -f "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-base-${{ github.run_id }}
          path: backups/*.gpg
          retention-days: 30
          if-no-files-found: error
